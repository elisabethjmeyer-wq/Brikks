<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Brikks - Mes évaluations">
    <title>Mes évaluations - Brikks</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/eleve-evaluations.css">
</head>
<body>

<div id="evaluations-page">
    <!-- Loader -->
    <div class="loader-container" id="loader">
        <div class="loader"></div>
        <p>Chargement des évaluations...</p>
    </div>

    <!-- Contenu principal -->
    <div id="evaluations-content" style="display: none;">
        <!-- Fil d'ariane -->
        <nav class="breadcrumb">
            <span class="breadcrumb-home" onclick="window.location.href='../index.html'">🏠 Accueil</span>
            <span class="breadcrumb-sep">›</span>
            <span>Mes évaluations</span>
        </nav>

        <!-- Header hero -->
        <header class="hero-header">
            <div class="hero-left">
                <h1 class="hero-title">Mes évaluations</h1>
                <p class="hero-subtitle">Passe tes évaluations et suis ta progression.</p>
                <div class="hero-btn" onclick="window.location.href='notes.html'">📊 Consulter mes résultats</div>
            </div>
            <div class="hero-separator"></div>
            <div class="hero-gauges" id="progressionBanner"><!-- Mini gauges --></div>
        </header>
        <div class="hero-hint">Survole une jauge pour voir ton objectif</div>

        <!-- Onglets -->
        <div class="tabs-bar">
            <button class="tab-btn active" data-tab="evaluations" onclick="EleveEvaluations.switchTab('evaluations')">
                <span class="tab-icon">📋</span>
                Mes évaluations <span class="tab-count" id="tabCountEvals">0</span>
            </button>
            <button class="tab-btn" data-tab="bonus" onclick="EleveEvaluations.switchTab('bonus')">
                <span class="tab-icon">⭐</span>
                Gagner plus de points <span class="tab-count" id="tabCountBonus">0</span>
            </button>
        </div>

        <!-- Contenu des onglets -->
        <div class="tab-content active" id="tab-evaluations">
            <div class="eval-list" id="evaluationsList"></div>
        </div>
        <div class="tab-content" id="tab-bonus">
            <div class="eval-list" id="bonusList"></div>
        </div>
    </div>
</div>

<!-- Modal review -->
<div class="modal-overlay hidden" id="reviewModal">
    <div class="review-modal">
        <button class="review-close" onclick="EleveEvaluations.closeReview()">&times;</button>
        <div id="reviewContent"></div>
    </div>
</div>

<!-- Scripts -->
<script src="../js/config.js"></script>
<script src="../js/sheets.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../components/eleve-layout.js"></script>
<script src="../js/eleve-evaluations.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', async function() {
        await EleveLayout.init('evaluations', 'Mes évaluations');
    });
</script>

</body>
</html>
