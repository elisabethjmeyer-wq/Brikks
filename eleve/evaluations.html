<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Brikks - Mes évaluations">
    <title>Mes évaluations - Brikks</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/eleve-evaluations.css">
</head>
<body>

<div id="evaluations-page">
    <!-- Loader -->
    <div class="loader-container" id="loader">
        <div class="loader"></div>
        <p>Chargement des évaluations...</p>
    </div>

    <!-- Contenu principal -->
    <div id="evaluations-content" style="display: none;">
        <!-- Header + Progression -->
        <header class="page-header">
            <div class="header-top">
                <div>
                    <h1>Mes évaluations</h1>
                    <p class="page-subtitle">Passe tes évaluations et suis ta progression.</p>
                </div>
            </div>
            <div id="progressionBanner"><!-- Rempli dynamiquement --></div>
        </header>

        <!-- Onglets -->
        <div class="tabs-bar">
            <button class="tab-btn active" data-tab="evaluations" onclick="EleveEvaluations.switchTab('evaluations')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
                Mes évaluations <span class="tab-count" id="tabCountEvals">0</span>
            </button>
            <button class="tab-btn" data-tab="bonus" onclick="EleveEvaluations.switchTab('bonus')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                Gagner plus de points <span class="tab-count" id="tabCountBonus">0</span>
            </button>
        </div>

        <!-- Contenu des onglets -->
        <div class="tab-content active" id="tab-evaluations">
            <div class="eval-list" id="evaluationsList"></div>
        </div>
        <div class="tab-content" id="tab-bonus">
            <div class="eval-list" id="bonusList"></div>
        </div>
    </div>
</div>

<!-- Modal review -->
<div class="modal-overlay hidden" id="reviewModal">
    <div class="review-modal">
        <button class="review-close" onclick="EleveEvaluations.closeReview()">&times;</button>
        <div id="reviewContent"></div>
    </div>
</div>

<!-- Scripts -->
<script src="../js/config.js"></script>
<script src="../js/sheets.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../components/eleve-layout.js"></script>
<script src="../js/eleve-evaluations.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', async function() {
        await EleveLayout.init('evaluations', 'Mes évaluations');
    });
</script>

</body>
</html>
