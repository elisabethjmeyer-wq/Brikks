<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Brikks - Evaluation">
    <title>Evaluation - Brikks</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/eleve-layout.css">
    <link rel="stylesheet" href="../css/eleve-exercices.css">
    <link rel="stylesheet" href="../css/eleve-connaissances.css">
    <link rel="stylesheet" href="../css/feedback-minimal.css">
    <link rel="stylesheet" href="../css/eleve-evaluation.css">
</head>
<body>

<div id="evaluation-page">
    <!-- Loader -->
    <div class="loader-container" id="loader">
        <div class="loader"></div>
        <p>Chargement de l'évaluation...</p>
    </div>

    <!-- Main Content -->
    <div class="evaluation-main" id="evaluationContent" style="display: none;">
        <!-- Exercise Container (rempli dynamiquement par renderExerciseView) -->
        <div id="exerciseContainer"></div>

        <!-- Result Container (visible après soumission) -->
        <div id="resultContainer" style="display: none;"></div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal-overlay hidden" id="confirmModal">
    <div class="modal modal-small">
        <div class="modal-header">
            <h2 id="confirmModalTitle">Confirmation</h2>
            <button class="modal-close" onclick="EleveEvaluation.closeConfirmModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p id="confirmModalMessage">Etes-vous sur ?</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="EleveEvaluation.closeConfirmModal()">Annuler</button>
            <button class="btn btn-primary" id="confirmModalBtn">Confirmer</button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="../js/config.js"></script>
<script src="../js/sheets.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/logger.js"></script>
<script src="../components/eleve-layout.js"></script>
<!-- Module d'entraînement connaissances (moteur de rendu réutilisé) -->
<script src="../js/eleve-connaissances.js"></script>
<script src="../js/eleve-connaissances-utils.js"></script>
<script src="../js/eleve-connaissances-formats.js"></script>
<script src="../js/eleve-connaissances-validation.js"></script>
<script src="../js/eleve-connaissances-results.js"></script>
<!-- Pilote évaluation -->
<script src="../js/eleve-evaluation.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        await EleveLayout.init('evaluations', 'Évaluation');
        EleveEvaluation.init();
    });
</script>

</body>
</html>
